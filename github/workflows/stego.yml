name: Embed Encrypted libbgmi.so into PNG

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  embed:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python 3.10
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3️⃣ Install dependencies via pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow pycryptodome

      # 4️⃣ Run the embed script
      - name: Run embed.py
        run: python embed.py

      # 5️⃣ Upload the generated stego.png as artifact
      - name: Upload stego image
        uses: actions/upload-artifact@v4
        with:
          name: stego-image
          path: stego.png
