name: Embed User .so into PNG

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Telegram user ID'
        required: true
      filename:
        description: 'Uploaded .so filename'
        required: true

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install Pillow pycryptodome
      - run: |
          python embed.py "uploads/${{ github.event.inputs.user_id }}/${{ github.event.inputs.filename }}" "stego_${{ github.event.inputs.user_id }}.png"
      - uses: actions/upload-artifact@v4
        with:
          name: stego_${{ github.event.inputs.user_id }}
          path: stego_${{ github.event.inputs.user_id }}.png
